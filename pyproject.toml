[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankparser-runtime"
dynamic = ["version"]
description = "Lightweight bank statement parsing runtime with a stable canonical model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ankur Malik"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "mt-940>=5.1.1,<6",
]

[project.urls]
Repository = "https://github.com/ankurmalik04/-bank-txn-reader"
Issues = "https://github.com/ankurmalik04/-bank-txn-reader/issues"

[project.optional-dependencies]
alternative = [
    "bankstatementparser==0.0.20",
    "lxml>=6.1.3,<7",
]
camt = [
    "bankstatementparser==0.0.20",
    "lxml>=6.1.3,<7",
]
ofx = [
    "ofxparse==0.21",
    "defusedxml>=0.7.1,<0.8",
    "lxml>=6.1.3,<7",
]
# Compatibility extra: native CSV is included in the base installation.
csv = []
all = ["bankstatementparser==0.0.20", "ofxparse==0.21", "defusedxml>=0.7.1,<0.8", "lxml>=6.1.3,<7"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.14,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
bankparser = "bankparser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "bankparser.version.__version__"}

[tool.setuptools.package-data]
bankparser = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["bankparser"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
